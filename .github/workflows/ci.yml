name: CI

on:
  push:
    paths-ignore: ["data/snapshots/**", "data/history.json", "data/b3/**", "data/proventos-recebidos.json", "data/plan.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
