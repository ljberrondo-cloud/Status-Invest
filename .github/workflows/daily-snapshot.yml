name: Snapshot diario

on:
  schedule:
    # 21:40 UTC = 18:40 en São Paulo, después del cierre de B3. Todos los días (cripto no cierra).
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar snapshot
        run: npm run snapshot
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "snapshot: $(TZ=America/Sao_Paulo date +%F)"
            git push
          fi
